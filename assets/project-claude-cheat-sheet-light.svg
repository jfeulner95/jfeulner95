<svg xmlns="http://www.w3.org/2000/svg" width="414" height="172" viewBox="0 0 414 172" role="img"
     aria-label="claude-cheat-sheet – Claude Code on one page.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: #656d76; }
    .label { font-size: 12px; fill: #656d76; }
    .chip { font-size: 13px; font-weight: 600; }
    .tile { animation: rise .7s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    
    .repo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .tag { font-size: 14.5px; fill: #424a53; }
    .topics { font-size: 11.5px; fill: #656d76; }
    .arrow { font-size: 18px; fill: url(#brand); font-weight: 700; }
  </style>

  <g class="tile" style="animation-delay:0.6s">
    <radialGradient id="g0_0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
        gradientTransform="translate(0 0) scale(372.6 189.20000000000002)">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <rect x="0" y="0" width="414" height="172" rx="20" fill="#f6f8fa"/>
    <rect x="0" y="0" width="414" height="172" rx="20" fill="url(#g0_0)"/>
    <rect x="0.5" y="0.5" width="413" height="171" rx="19.5" fill="none"
          stroke="#1f2328" stroke-opacity="0.1"/>
    
    <text x="24" y="38" class="eyebrow">PROJECT</text>
    <text x="390" y="42" class="arrow" text-anchor="end">↗</text>
    <text x="24" y="74" class="repo">claude-cheat-sheet</text>
    <text x="24" y="100" class="tag">Claude Code on one page.</text>
    <text x="24" y="122" class="topics mono">cli · slash commands · shortcuts · mcp · hooks</text>
    <circle cx="29" cy="142" r="5" fill="#4ade80"/><text x="40" y="146" class="label">Shell</text><text x="390" y="146" class="label" text-anchor="end">updated 3 days ago</text>
  </g>
</svg>
