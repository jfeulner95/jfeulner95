    <text x="28" y="44" class="eyebrow">HELLO, I'M</text>
    <text x="28" y="94" class="name">Johannes Feulner</text>
    <text x="28" y="128" class="role">Embedded Dev &amp; AI Tinkerer</text>
    <text x="28" y="164" class="bio">Embedded developer by day, AI-workflow tinkerer by night.</text>
    <text x="28" y="186" class="bio">I like making hardware and tools talk to each other.</text>
