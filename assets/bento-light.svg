<svg xmlns="http://www.w3.org/2000/svg" width="840" height="432" viewBox="0 0 840 432" role="img"
     aria-label="Johannes Feulner – Embedded Dev &amp; AI Tinkerer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: #656d76; }
    .label { font-size: 12px; fill: #656d76; }
    .chip { font-size: 13px; font-weight: 600; }
    .tile { animation: rise .7s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    
    .name { font-size: 42px; font-weight: 800; letter-spacing: -1.2px; }
    .role { font-size: 21px; font-weight: 700; fill: url(#brand); }
    .bio { font-size: 14.5px; fill: #424a53; }
    .num { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
    .big { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
    .wave { fill: none; stroke-width: 2.5; stroke-linejoin: round; animation: scroll 1.6s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(3.5); opacity: 0; } }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(36px); } }
  </style>

  <g class="tile" style="animation-delay:0.0s">
    <radialGradient id="g0_0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
